packages:
  - "."
  - "workspaces/*/apps/*"
  - "workspaces/*/packages/*"

overrides:
  "@modelcontextprotocol/sdk": 1.32.1
  "typed-rest-client>qs": 6.16.1

allowBuilds:
  "@ast-grep/cli": true
  esbuild: true
  playwright: true

# The packaged bridge runs on the Mac host and Linux guests.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
