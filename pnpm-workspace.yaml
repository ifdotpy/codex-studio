packages:
  - "."
  - "workspaces/*/apps/*"
  - "workspaces/*/packages/*"

overrides:
  "@modelcontextprotocol/sdk": 1.32.1
  "typed-rest-client>qs": 6.16.1

allowBuilds:
  esbuild: true
  playwright: true

# The packaged bridge runs on the Mac host and Linux guests.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc

patchedDependencies:
  # Weak event-bulk caching releases payloads; projection pulls retain 409
  # conflicts for server-sequence comparison. The incremental-write queue fix
  # is upstream in 17.6.0. Recheck the remaining patch on every RxDB upgrade.
  rxdb@17.6.0: patches/rxdb@17.6.0.patch
