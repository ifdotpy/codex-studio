[package]
name = "studio-client-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "studio_client_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
studio-client-domain = { path = "../client-domain" }
libc.workspace = true
ring.workspace = true
percent-encoding = "=2.3.2"
uuid.workspace = true
sha2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
unicode-segmentation = "=1.13.3"
vt100 = "=0.16.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["fs"] }
base64.workspace = true
webrtc = "=0.21.0"
rtc = { version = "=0.21.0", default-features = false }
unsafe-libopus = "=0.2.0"
async-trait = "0.1"
bytes = "1"
usvg = "=0.45.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
regex = "=1.13.1"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "=0.6.4"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGDataProvider", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGAffineTransform"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKFrameInfo", "WKContentWorld", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSEvent", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSImage", "NSBitmapImageRep", "NSImageRep", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSError", "NSProcessInfo", "NSLocale", "NSGeometry", "NSBundle", "NSNotification", "NSOperation", "block2"] }
objc2-quick-look-ui = { version = "=0.3.2", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewView", "objc2-app-kit"] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTime", "AVAudioTypes", "AVAudioPlayer", "AVAudioChannelLayout", "AVAudioSourceNode", "AVAudioMixerNode", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes", "objc2"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNNotificationSettings"] }
dispatch2 = "=0.3.1"
block2 = "=0.6.2"


[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.4"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGDataProvider", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGAffineTransform"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSError", "NSProcessInfo", "NSLocale", "NSGeometry", "NSBundle", "NSNotification", "NSOperation", "block2"] }

[dev-dependencies]
rustls.workspace = true
rcgen = "=0.14.10"
