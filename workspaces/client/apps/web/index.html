<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171719" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Codex Studio" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Codex Studio</title>
    <style>
      .studio-startup {
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        padding: 24px;
        margin: 0;
        background: #171719;
        color: #ececef;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      .studio-startup p {
        margin: 8px 0;
      }
      .studio-startup a {
        color: #bfb4ff;
      }
      body:has(.studio-startup) {
        margin: 0;
        background: #171719;
      }
    </style>
    <script src="/studio-startup.js" defer></script>
    <link rel="icon" type="image/png" href="/src/assets/codex-studio.png" />
  </head>
  <body>
    <div id="root">
      <main class="studio-startup" aria-label="Studio startup">
        <p role="status" id="studio-startup-status">Opening Studio…</p>
        <p id="studio-startup-help">Connecting to your Mac.</p>
        <p><a href="/">Reload Studio</a></p>
        <noscript>Enable JavaScript to open Studio.</noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
