[package]
name = "studio-native-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
native-check = []

[lib]
name = "studio_native_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
studio-client-core = { path = "../../../packages/client-core" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSNotification", "NSOperation", "NSValue", "NSURL", "NSError", "NSTimer", "NSDate", "block2"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIApplication", "UIResponder", "UIView", "UIScrollView", "UIGeometry", "UIWindow", "UIScreen", "UIScene", "UIWindowScene"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler"] }
