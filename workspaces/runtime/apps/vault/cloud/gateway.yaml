AWSTemplateFormatVersion: "2010-09-09"
Description: Studio vault gateway (docs/vault.md) - one IPv6-only t4g.nano in the tailnet that serves every vault.

Parameters:
  ArtifactsBucket:
    Type: String
  ImageId:
    Type: AWS::EC2::Image::Id
  Host:
    Type: String
    AllowedPattern: "[a-z0-9.-]{3,253}"
  ZoneId:
    Type: AWS::Route53::HostedZone::Id
  AuthKeyParameter:
    Type: String
    Default: /studio-vault/gateway/tailscale-auth-key

Resources:
  # IPv6 only: no public IPv4 address to pay for. Tailscale, S3, STS, SSM, Route 53, Let's
  # Encrypt and the Debian and Tailscale package servers all answer on IPv6.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: studio-vault-gateway }]
  VpcIpv6:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref Vpc
      AmazonProvidedIpv6CidrBlock: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultIpv6Route:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref Routes
      DestinationIpv6CidrBlock: "::/0"
      GatewayId: !Ref Gateway
  Subnet:
    Type: AWS::EC2::Subnet
    DependsOn: VpcIpv6
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      Ipv6Native: true
      Ipv6CidrBlock:
        !Select [0, !Cidr [!Select [0, !GetAtt Vpc.Ipv6CidrBlocks], 1, 64]]
      AssignIpv6AddressOnCreation: true
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: resource-name
        EnableResourceNameDnsAAAARecord: true
        EnableResourceNameDnsARecord: false
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref Routes

  # Nothing comes in except WireGuard, which answers only tailnet peers; the site listens on the
  # tailnet address only.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Studio vault gateway
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 41641
          ToPort: 41641
          CidrIpv6: "::/0"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIpv6: "::/0"

  # A fixed name: project stacks in other accounts trust this role by its ARN.
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: studio-vault-gateway
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: vault-gateway
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactsBucket}/gateway/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ArtifactsBucket}"
                Condition:
                  StringLike:
                    s3:prefix: gateway/*
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::*:role/studio-vault-reader-*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthKeyParameter}"
              # Only the host's address and its ACME challenge.
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${ZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Ref Host
                      - !Sub "_acme-challenge.${Host}"
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${ZoneId}"
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action: route53:ListHostedZones
                Resource: "*"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultIpv6Route
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t4g.nano
      # Standard credits: a busy CPU slows down instead of adding charges.
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
          GroupSet: [!Ref SecurityGroup]
          Ipv6AddressCount: 1
      PrivateDnsNameOptions:
        HostnameType: resource-name
        EnableResourceNameDnsAAAARecord: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpProtocolIpv6: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: studio-vault-gateway }]
      # First boot only: packages, Tailscale's apt source, then sync.py from the current release,
      # which converges the rest and installs its own timer.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          fallocate -l 512M /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo "/swapfile none swap sw 0 0" >> /etc/fstab
          for try in 1 2 3 4 5; do apt-get update && break || sleep 15; done
          apt-get install -y --no-install-recommends ca-certificates curl nodejs python3-boto3 \
            certbot python3-certbot-dns-route53 unattended-upgrades
          curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg \
            -o /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list \
            -o /etc/apt/sources.list.d/tailscale.list
          apt-get update
          apt-get install -y tailscale
          cat > /etc/apt/apt.conf.d/52vault-gateway <<'EOF'
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Origins-Pattern:: "origin=Tailscale";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:30";
          EOF
          mkdir -p /etc/vault-gateway
          cat > /etc/vault-gateway/source.json <<'EOF'
          {"bucket": "${ArtifactsBucket}", "region": "${AWS::Region}", "authKeyParameter": "${AuthKeyParameter}"}
          EOF
          export AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE=IPv6 AWS_USE_DUALSTACK_ENDPOINT=true
          python3 - <<'EOF'
          import boto3, hashlib, io, json, tarfile
          source = json.load(open("/etc/vault-gateway/source.json"))
          s3 = boto3.client("s3", region_name=source["region"])
          release = json.load(s3.get_object(Bucket=source["bucket"], Key="gateway/release.json")["Body"])
          data = s3.get_object(Bucket=source["bucket"], Key=release["key"])["Body"].read()
          assert hashlib.sha256(data).hexdigest() == release["sha256"]
          tarfile.open(fileobj=io.BytesIO(data)).extract("./sync.py", "/run/vault-gateway-boot", filter="data")
          EOF
          python3 /run/vault-gateway-boot/sync.py

Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
  InstanceId:
    Value: !Ref Instance
