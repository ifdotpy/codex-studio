AWSTemplateFormatVersion: "2010-09-09"
Description: Studio vault gateway domain (docs/vault.md). The registrar points the domain to these name servers.

Parameters:
  Domain:
    Type: String
    AllowedPattern: "[a-z0-9.-]{3,253}"

Resources:
  # The zone outlives the gateway: the registrar names its servers, and passkeys are bound to the
  # gateway host in it. The gateway role may change only its host and ACME challenge records.
  Zone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref Domain
      HostedZoneConfig:
        Comment: Studio vault gateway

Outputs:
  ZoneId:
    Value: !Ref Zone
  NameServers:
    Value: !Join [",", !GetAtt Zone.NameServers]
