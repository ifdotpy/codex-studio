AWSTemplateFormatVersion: "2010-09-09"
Description: Studio project vault (docs/vault.md) - bucket, write-only writer, reader role for the gateway.

Parameters:
  Prefix:
    Type: String
    # The reader role name is studio-vault-reader-<prefix>, at most 64 characters, and the
    # gateway page of the vault is /<prefix>/, so no dots.
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9_-]{0,43}"
  GatewayRoleArn:
    Type: String
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/.+"

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  Writer:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: vault-writer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${Bucket.Arn}/${Prefix}/states/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub "${Prefix}/states/*"

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriterOnlyAddsNewObjects
            Effect: Deny
            Principal:
              AWS: !GetAtt Writer.Arn
            Action: s3:PutObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              "Null":
                s3:if-none-match: "true"

  # The gateway (gateway.yaml, maybe in another account) reads states and slots and changes
  # passkey slots through this role. The trust names the gateway role by ARN, so a new gateway
  # role with the same name keeps access.
  Reader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "studio-vault-reader-${Prefix}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:aws:iam::${Account}:root"
                - Account: !Select [4, !Split [":", !Ref GatewayRoleArn]]
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref GatewayRoleArn
      Policies:
        - PolicyName: vault-reader
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${Bucket.Arn}/${Prefix}/states/*"
                  - !Sub "${Bucket.Arn}/${Prefix}/slots/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/${Prefix}/slots/passkey-*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${Prefix}/states/*"
                      - !Sub "${Prefix}/slots/*"

Outputs:
  BucketName:
    Value: !Ref Bucket
  WriterUserName:
    Value: !Ref Writer
  ReaderRoleArn:
    Value: !GetAtt Reader.Arn
