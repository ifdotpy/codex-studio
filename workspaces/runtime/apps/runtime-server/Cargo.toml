[package]
autotests = false
name = "studio-runtime-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
getrandom = { workspace = true }
futures-util = { workspace = true }
mime_guess = { workspace = true }
notify = { workspace = true }
studio-runtime-process = { path = "../../packages/runtime-process" }
studio-runtime-providers = { path = "../../packages/runtime-providers" }
studio-runtime-http = { path = "../../packages/runtime-http" }
studio-runtime-services = { path = "../../packages/runtime-services" }
studio-runtime-store = { path = "../../packages/runtime-store" }
nix = { workspace = true }
process-wrap = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
studio-runtime-store = { path = "../../packages/runtime-store", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
