[package]
name = "layr"
version = "0.1.0"
edition = "2021"
description = "Local version control for agent workspaces on btrfs"
license = "MIT"
publish = false

[[bin]]
name = "layr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
ignore = "0.4"
libc = "0.2"
rand = "0.8"
regex = "1"
rustix = { version = "1", features = ["fs", "net", "process", "thread", "event", "stdio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[profile.release]
debug = 1
