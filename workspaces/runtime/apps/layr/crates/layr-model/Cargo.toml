[package]
name = "layr-model"
version = "0.1.0"
edition = "2021"
description = "Pure project read model for signed Layr records"
license = "MIT"

[dependencies]
html5gum = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.42"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
similar = "2"
layr-store = { path = "../layr-store", default-features = false }
ed25519-dalek = "2"

[dev-dependencies]
layr-store = { path = "../layr-store" }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
layr-store = { path = "../layr-store", default-features = false, features = ["wasm"] }
