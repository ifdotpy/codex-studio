[package]
name = "studio-process-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codex-process-supervisor"
path = "src/main.rs"

[dependencies]
studio-runtime-process = { path = "../../packages/runtime-process" }

[dev-dependencies]
rusqlite.workspace = true
studio-runtime-store = { path = "../../packages/runtime-store", features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["param"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
studio-runtime-proc-sys = { path = "../../packages/runtime-proc-sys" }

[lints]
workspace = true
