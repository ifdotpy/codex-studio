[package]
autotests = false
name = "studio-runtime-store"
version.workspace = true
edition.workspace = true
description = "Async SQLite state store for the Codex Studio runtime"
license.workspace = true
publish.workspace = true

[dependencies]
data-encoding = { workspace = true }
inventory = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
studio-runtime-schema = { path = "../runtime-schema", features = ["sqlite"] }
studio-runtime-providers = { path = "../runtime-providers" }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio-rusqlite = { workspace = true }
tokio = { workspace = true }
zstd-safe = { workspace = true }

[dev-dependencies]
schemars.workspace = true
strum.workspace = true
studio-runtime-store = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true

[features]
# Lets other crates' tests open an independent read-only canvas connection.
test-support = []

[[test]]
name = "integration"
path = "tests/integration.rs"
