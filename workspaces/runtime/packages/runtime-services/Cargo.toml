[package]
name = "studio-runtime-services"
version.workspace = true
edition.workspace = true
description = "Synchronous application services of the Codex Studio runtime"
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
getrandom = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
mime_guess = { workspace = true }
process-wrap = { workspace = true }
sha2 = { workspace = true }
studio-runtime-process = { path = "../runtime-process" }
studio-runtime-providers = { path = "../runtime-providers" }
studio-runtime-store = { path = "../runtime-store" }
thiserror = { workspace = true }
jsonschema = { version = "=0.49.9", default-features = false }
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

[lints]
workspace = true
