[package]
name = "studio-runtime-services"
version.workspace = true
edition.workspace = true
description = "Application services of the Codex Studio runtime"
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
futures-util.workspace = true
getrandom = { workspace = true }
notify = { workspace = true }
process-wrap = { workspace = true }
regex = "=1.13.1"
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
mime_guess = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
shlex = "=2.0.1"
spki = { workspace = true }
studio-runtime-process = { path = "../runtime-process" }
studio-runtime-providers = { path = "../runtime-providers" }
studio-runtime-schema = { path = "../runtime-schema" }
studio-runtime-store = { path = "../runtime-store" }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
jsonschema = { version = "=0.49.9", default-features = false }

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
