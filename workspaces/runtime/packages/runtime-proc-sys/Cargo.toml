[package]
name = "studio-runtime-proc-sys"
version.workspace = true
edition.workspace = true
description = "Read-only macOS libproc and sysctl queries for supervisor process identity"
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# A second exception to the runtime's unsafe ban: read-only macOS process queries.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unwrap_used = "warn"
