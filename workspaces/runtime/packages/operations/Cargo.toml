[package]
autotests = false
name = "studio-operations"
version.workspace = true
edition.workspace = true
description = "Pure operation lifecycle transitions for Codex Studio"
license.workspace = true
publish.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
studio-test-deps = { path = "../test-deps" }
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
