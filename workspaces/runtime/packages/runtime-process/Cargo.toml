[package]
autotests = false
name = "studio-runtime-process"
version.workspace = true
edition.workspace = true
description = "Synchronous process and supervisor ports for the Codex Studio runtime"
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
file-rotate.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
studio-runtime-providers = { path = "../runtime-providers" }
studio-runtime-store = { path = "../runtime-store" }
thiserror.workspace = true
strum.workspace = true
tokio.workspace = true
pty-process = "=0.5.3"

[target.'cfg(unix)'.dependencies]
command-fds = "=0.3.2"
process-wrap.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
studio-runtime-priority-sys = { path = "../runtime-priority-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
studio-runtime-proc-sys = { path = "../runtime-proc-sys" }

[dev-dependencies]
studio-runtime-store = { path = "../runtime-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
