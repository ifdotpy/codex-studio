<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A conversation with your Codex lead and its team."
    />
    <title>Codex agents</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar" aria-label="Conversations">
      <a class="brand" href="/">codex<span>agents</span></a>
      <button id="new-chat" class="new-chat"><span>＋</span> New chat</button>
      <label class="search"
        ><input
          id="chat-search"
          type="search"
          placeholder="Search chats"
          aria-label="Search chats"
      /></label>
      <nav id="chat-list" aria-label="Lead conversations"></nav>
      <div class="sidebar-bottom">
        <button id="import-chat">Import from Codex</button
        ><button id="other-sessions">Other sessions</button>
      </div>
    </aside>
    <main>
      <header>
        <button
          id="sidebar-toggle"
          class="icon"
          aria-label="Toggle conversations"
        >
          ☰
        </button>
        <div class="conversation-heading">
          <button id="back-lead" hidden>← Lead</button>
          <h1 id="conversation-title">New conversation</h1>
          <span id="conversation-status"></span>
        </div>
        <select id="model" aria-label="Lead model">
          <option value="gpt-6-astra">Astra</option>
          <option value="gpt-5.6-sol">Sol</option>
        </select>
        <button id="view-toggle" aria-pressed="false">Canvas</button>
        <button id="team-toggle" aria-pressed="false" hidden>Team</button>
        <details id="conversation-menu">
          <summary aria-label="Conversation actions">•••</summary>
          <div class="menu">
            <button data-action="monitor">Monitor a command</button
            ><button data-action="compact">Compact context</button
            ><button data-action="review">Review changes</button
            ><button data-action="stop-team" class="danger">Stop team</button>
          </div>
        </details>
      </header>
      <div id="error" role="alert" hidden></div>
      <section id="conversation" aria-label="Conversation">
        <div id="messages" tabindex="0"></div>
        <button id="jump-latest" class="jump" hidden>↓ Latest</button>
        <div id="requests" aria-live="polite"></div>
        <form id="composer">
          <textarea
            id="message"
            aria-label="Message"
            placeholder="What should we work on?"
            rows="2"
            maxlength="12000"
          ></textarea>
          <div class="composer-bar">
            <button type="button" id="project" title="Project directory">
              Project</button
            ><span id="send-state" role="status"></span
            ><button
              type="button"
              id="stop"
              class="icon"
              aria-label="Stop agent"
              hidden
            >
              ■</button
            ><button
              id="send"
              type="submit"
              class="send"
              aria-label="Send message"
            >
              ↑
            </button>
          </div>
        </form>
        <p class="composer-hint">
          Enter to send · Shift + Enter for a new line
        </p>
      </section>
      <section
        id="canvas"
        tabindex="0"
        aria-label="Agent canvas. Drag the background to pan. Scroll to zoom. Select an agent to open its chat."
        hidden
      >
        <div id="world">
          <svg id="edges" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
        <button id="fit" class="canvas-fit">Fit</button>
        <p class="canvas-hint">Drag to pan · Scroll to zoom</p>
      </section>
    </main>
    <aside id="team" aria-label="Workers" hidden>
      <div class="team-heading">
        <h2>Team</h2>
        <button id="team-close" class="icon" aria-label="Close team">×</button>
        <span id="team-count"></span>
      </div>
      <button id="lead-row"></button>
      <input
        id="worker-search"
        type="search"
        placeholder="Find a worker"
        aria-label="Find a worker"
      />
      <div id="workers"></div>
      <div id="monitors"></div>
    </aside>
    <dialog id="picker">
      <div class="dialog-heading">
        <h2 id="picker-title"></h2>
        <button class="icon" id="close-picker" aria-label="Close">×</button>
      </div>
      <div id="picker-body"></div>
    </dialog>
    <dialog id="answer-dialog">
      <form id="answer-form">
        <div class="dialog-heading">
          <h2>Reply to the agent</h2>
          <button
            type="button"
            class="icon"
            id="close-answer"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <div id="answer-fields"></div>
        <button class="primary" type="submit">Send answer</button>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
