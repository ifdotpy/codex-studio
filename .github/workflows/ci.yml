name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89f4f18f0b30c4a9b480c62979d6a5d7 # v4.1.0
        with:
          package_json_file: package.json
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Tooling tests
        run: pnpm run test:tooling
      - name: Pre-commit hook tests
        run: pnpm run test:pre-commit
      - name: Web TypeScript application project
        run: pnpm --filter codex-agents-web run typecheck:focused
      - name: Web TypeScript API contract project
        run: pnpm --filter codex-agents-web run test:api-contract-types
      - name: Web TypeScript test helper project
        run: pnpm run typecheck:client-helper
      - name: Client unit tests
        run: pnpm run test:client:unit
      - name: Server bridge tests
        run: pnpm run test:server:bridge

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          components="$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')"
          test -n "$channel"
          test -n "$components"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      # v1.99.0 is selected from rust-toolchain.toml; the action itself is pinned to this commit.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned master action; Rust 1.99.0 configured above
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked

  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89f4f18f0b30c4a9b480c62979d6a5d7 # v4.1.0
        with:
          package_json_file: package.json
      - name: Prepare the repository-managed Python environments
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/codex-studio-cache" >> "$GITHUB_ENV"
          XDG_CACHE_HOME="$RUNNER_TEMP/codex-studio-cache" python3 workspaces/runtime/apps/server/src/install-cli.py --dev --bin-dir "$RUNNER_TEMP/codex-studio-bin"
      - name: Strict runtime mypy ratchet
        run: pnpm run typecheck:runtime
      - name: API generated-types check
        run: pnpm run api:check

  facade:
    name: Just facade checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89f4f18f0b30c4a9b480c62979d6a5d7 # v4.1.0
        with:
          package_json_file: package.json
      - name: Read the pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          components="$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')"
          test -n "$channel"
          test -n "$components"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      # v1.99.0 is selected from rust-toolchain.toml; the action itself is pinned to this commit.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned master action; Rust 1.99.0 configured above
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Just from its locked crate
        run: cargo install just --version 1.58.0 --locked
      - name: Verify Just version
        run: test "$(just --version)" = "just 1.58.0"
      - name: Prepare the repository-managed Python environments
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/codex-studio-cache" >> "$GITHUB_ENV"
          XDG_CACHE_HOME="$RUNNER_TEMP/codex-studio-cache" python3 workspaces/runtime/apps/server/src/install-cli.py --dev --bin-dir "$RUNNER_TEMP/codex-studio-bin"
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: List facade recipes
        run: just --list
      - name: Focused JavaScript facade test
        run: just test codex-studio-tooling
      - name: Focused Rust facade test
        run: just test studio-diagnostics
      - name: Focused Python facade test
        run: just test server test_codex_python
