name: Native Linux libraries
description: Install the Linux WebView and tray libraries that the native desktop crate builds and runs against.
runs:
  using: composite
  steps:
    - name: Install native Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The hosted image reads this mirror list. Avoid the Azure mirror's slow
        # downloads, which can consume the entire Rust job deadline.
        sudo install -m 644 "$GITHUB_ACTION_PATH/apt-mirrors.txt" /etc/apt/apt-mirrors.txt
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
