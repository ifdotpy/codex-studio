[mypy]
python_version = 3.11
files = scripts/studio_api
plugins = pydantic.mypy
strict = True
warn_unused_ignores = True
show_error_codes = True

# Routers call legacy runtime services that predate annotations. New API modules
# and their public models stay fully typed while crossing those typed context
# methods into the existing implementation.
disallow_untyped_calls = False
