[mypy]
python_version = 3.11
files = workspaces/runtime/apps/server/src
plugins = pydantic.mypy
strict = True
warn_unused_ignores = True
show_error_codes = True

# Calls into modules that are still in the ratchet list below are not reported as
# untyped calls, so a module can become clean before the modules it calls.
# Keep this list equal to the ratchet list: remove a module here when its
# section below is removed.
