[workspace]
resolver = "3"
members = [
    "workspaces/client/apps/layr-studio",
    "workspaces/client/apps/native/src-tauri",
    "workspaces/client/packages/client-core",
    "workspaces/client/packages/client-domain",
    "workspaces/client/packages/client-wasm",
    "workspaces/runtime/apps/diagnostics",
    "workspaces/runtime/apps/peer-link",
    "workspaces/runtime/apps/process-supervisor",
    "workspaces/runtime/apps/runtime-server",
    "workspaces/runtime/packages/operations",
    "workspaces/runtime/packages/runtime-providers",
    "workspaces/runtime/packages/runtime-priority-sys",
    "workspaces/runtime/packages/runtime-proc-sys",
    "workspaces/runtime/packages/runtime-process",
    "workspaces/runtime/packages/runtime-http",
    "workspaces/runtime/packages/runtime-services",
    "workspaces/runtime/packages/runtime-schema",
    "workspaces/runtime/packages/runtime-store",
    "workspaces/runtime/packages/test-deps",
]
# The vendored layr and layr-desk sources (scripts update-vm-layr.py) build inside the Linux VM
# guest with their own lints; they are not part of this workspace.
exclude = ["workspaces/runtime/apps/layr", "workspaces/runtime/apps/layr-desk"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# The configured JSON type restriction is opt-in at closed typed owners.
disallowed_types = "allow"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unwrap_used = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
# Fully bound contracts must expose new fields to the compiler.
rest_pat_in_fully_bound_structs = "deny"
# Flag ambiguous boolean argument lists and matches better expressed as conditionals.
fn_params_excessive_bools = "deny"
match_bool = "deny"
# Avoid large inline enum variants and unnecessary references to small Copy values.
large_enum_variant = "deny"
trivially_copy_pass_by_ref = "deny"

[workspace.dependencies]
schemars = { version = "=1.2.3", features = ["derive"] }
bytes = "=1.12.1"
brotli = "=9.0.0"
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
data-encoding = "=2.11.1"
file-rotate = "=0.8.0"
http-range-header = "=0.4.2"
inventory = "=0.3.25"
libc = "=0.2.191"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "v5"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip", "raw_value"] }
serde_path_to_error = "=0.1.20"
jsonschema = { version = "=0.60.0", default-features = false }
mime_guess = "=2.0.5"
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process", "fs", "time"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["process-group", "std", "tokio1"] }
tempfile = "=3.27.0"
futures-executor = "=0.3.34"
futures-util = "=0.3.34"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "hooks", "trace"] }
tokio-rusqlite = "=0.8.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
sha2 = "=0.11.1"
strum = { version = "=0.28.0", default-features = false, features = ["derive"] }
thiserror = "=2.0.21"
zstd-safe = { version = "=8.0.0", default-features = false, features = ["std", "zdict_builder"] }

axum = "=0.8.9"
form_urlencoded = "=1.2.2"
getrandom = "=0.4.3"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "=0.7.20", default-features = false }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
spki = { version = "=0.8.1", features = ["std"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

# The server hashes its own executable at startup, a file of up to a gigabyte in
# a debug build; unoptimized hashing delayed readiness by about 20 seconds.
# Debug info level for local builds and tests. Full debuginfo made each
# runtime-services test binary about 1 GB and dominated link time and disk
# use (#373); line tables keep file:line in backtraces, dependencies carry none.
# Line tables let live `perf` attribute inlined frames to source lines; no runtime cost.
[profile.release]
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[patch.crates-io]
# nix 0.31.3 references macOS-only libc symbols on iOS. Pin upstream fix #2821
# until it is published: https://github.com/nix-rust/nix/pull/2821
nix = { git = "https://github.com/nix-rust/nix", rev = "f9ba3ed0698255d93240b07ecbf39ecb05a8a5cd" }
