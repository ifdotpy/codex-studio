[workspace]
resolver = "3"
members = [
    "workspaces/runtime/apps/diagnostics",
    "workspaces/runtime/packages/operations",
    "workspaces/runtime/packages/operations-python",
    "workspaces/runtime/packages/runtime-providers",
    "workspaces/runtime/packages/runtime-process",
    "workspaces/runtime/packages/runtime-store",
]
# The vendored layr and layr-desk sources (scripts update-vm-layr.py) build inside the Linux VM
# guest with their own lints; they are not part of this workspace.
exclude = ["workspaces/runtime/apps/layr", "workspaces/runtime/apps/layr-desk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "arbitrary_precision"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
sha2 = "0.11.0"
thiserror = "=2.0.17"
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
