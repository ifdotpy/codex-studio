[workspace]
resolver = "3"
members = [
    "workspaces/runtime/apps/diagnostics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
