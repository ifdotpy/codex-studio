[workspace]
resolver = "3"
members = [
    "workspaces/runtime/apps/diagnostics",
    "workspaces/runtime/apps/runtime-server",
    "workspaces/runtime/packages/operations",
    "workspaces/runtime/packages/operations-python",
    "workspaces/runtime/packages/runtime-providers",
    "workspaces/runtime/packages/runtime-process",
    "workspaces/runtime/packages/runtime-http",
    "workspaces/runtime/packages/runtime-services",
    "workspaces/runtime/packages/runtime-store",
]
# The vendored layr and layr-desk sources (scripts update-vm-layr.py) build inside the Linux VM
# guest with their own lints; they are not part of this workspace.
exclude = ["workspaces/runtime/apps/layr", "workspaces/runtime/apps/layr-desk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unwrap_used = "warn"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "float_roundtrip"] }
serde_path_to_error = "=0.1.20"
jsonschema = { version = "=0.49.9", default-features = false }
data-encoding = "=2.11.1"
mime_guess = "=2.0.5"
http-range-header = "=0.4.2"
futures-util = "=0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
sha2 = "0.11.0"
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
strum = { version = "=0.28.0", default-features = false, features = ["derive"] }
thiserror = "=2.0.17"
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group"] }
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }

axum = "=0.8.9"
form_urlencoded = "=1.2.2"
getrandom = "=0.3.4"
subtle = "=2.6.1"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
