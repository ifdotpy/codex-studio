[workspace]
resolver = "3"
members = [
    "workspaces/runtime/apps/diagnostics",
    "workspaces/runtime/packages/operations",
    "workspaces/runtime/packages/operations-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "arbitrary_precision"] }
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
