nextest-version = "0.9.146"
# Conversation detail publication and bounded subscription baselines are fast witnesses.

[profile.default]
fail-fast = true
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "final"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# The measured comprehensive maximum is ~60 s (the busy-service deadline witness).
slow-timeout = { period = "30s", terminate-after = 3 }
junit.path = "junit.xml"

# Single owner of fast Rust witnesses. Cargo still builds the complete workspace;
# this nextest execution profile changes selection only, never Cargo's feature graph.
[profile.fast]
# T17 clauses cover transactional errors, startup readiness, and native delivery.
inherits = "ci"
# Clause 1: Rust operator CLI witnesses: Check isolated user service managers, delivery layout, safe link migration, and idempotent retries without touching host services.
# Clause 2: VM tools, host_exec tool and Mac service witnesses: Check that a lost answer never repeats a Mac command, that only VM writers run commands, and that the unchanged guest broker works with the service process.
# Clause 3: VM tools, host_exec tool and Mac service witnesses: Check that a lost answer never repeats a Mac command, that only VM writers run commands, and that the unchanged guest broker works with the service process.
# Clause 4: Linux VM start, watchdog and share mount witnesses: Check that only a VM that the Mac restart stopped starts by itself, with a fake helper and guest, and that the helper runs in its own session.
# Clause 5: Linux VM start, watchdog and share mount witnesses: Check that only a VM that the Mac restart stopped starts by itself, with a fake helper and guest, and that the helper runs in its own session.
# Clause 6: retained provider disconnect witnesses: Check that a replaced worker leaves the live turn of a retained provider running and tells no parent, while a provider exit stays a disconnect, and that a turn stopped while no worker was attached is interrupted once by the worker that reattaches, never again after a lost reply.
# Clause 7: retained provider disconnect witnesses: Check that a replaced worker leaves the live turn of a retained provider running and tells no parent, while a provider exit stays a disconnect, and that a turn stopped while no worker was attached is interrupted once by the worker that reattaches, never again after a lost reply.
# Clause 8: retained provider disconnect witnesses: Check that a replaced worker leaves the live turn of a retained provider running and tells no parent, while a provider exit stays a disconnect, and that a turn stopped while no worker was attached is interrupted once by the worker that reattaches, never again after a lost reply.
# Clause 9: draft wire and legacy compatibility witnesses: Keep new draft payloads compatible with native receive without rewriting stored legacy drafts.
# Clause 10: JSON and stream compression with native decoding witnesses: Preserve representation hashes and per-event delivery while reducing JSON and sync stream transfer bytes.
# Clause 11: native client boundary witnesses: Preserve keyed draft decoding, terminal dimensions, certificate rejection, exact signed HTTP bytes and SVG resource isolation across dependency updates.
# Clause 12: provider request body ownership witnesses: Check that emitted requests retain only metadata, queued bodies move on first emission, and uncertainty, late replies and unsent cancellation preserve correlation.
# Clause 13: journal agent publication witnesses: Check that notification and stream-flush batches project and validate each changed agent once inside their atomic journal transaction.
# Clause 14: agent decode ownership witness: Check one decode and volatile merge per changed agent, no intermediate text round trip, no unrelated reads, and no replay work.
# Clause 15: transaction diagnostics ownership witnesses: Check one collector lock per writer transaction while preserving all waits, caller sites, thresholds and sample windows.
# Clause 16: Rust state migration and SQL callback witnesses: Check that older states migrate to current agent columns and wake indexes once, and that SQL callbacks reject filesystem and process work.
# Clause 17: server command snapshot witnesses: Check that idle commands do not rewrite snapshots, changed output coalesces, failed writes retry, and an existing start fence prevents another process.
# Clause 18: provider callback, task submission and monitor projection witnesses: Check that a provider request is durably accepted with its journal batch, that its record owns the answer through every crash point without a repeated answer, and that an unanswered request never stops provider events or new work, that a native approval or question of a lead waits as a card and its user answer reaches the provider once, also after a worker reattach, that a stamp left by an undelivered steer batch is replaced instead of holding the agent, and that busy-turn input written after the provider's reported turn end starts the next turn once instead of failing unconfirmed. Monitor output must publish exactly one monitor projection while preserving window membership and rollback. Task submissions keep limits, workspace ownership and replay at the shared manifest bound. Native-history recovery continues authorized workers once, preserves explicit Stop, and never replays uncertain input. An account transfer member moves at its next wake and keeps its queued input, a blocked member waits without a write per wake, and a move that sent no thread request can be cancelled.
# Clause 19: provider callback, task submission and monitor projection witnesses: Check that a provider request is durably accepted with its journal batch, that its record owns the answer through every crash point without a repeated answer, and that an unanswered request never stops provider events or new work, that a native approval or question of a lead waits as a card and its user answer reaches the provider once, also after a worker reattach, that a stamp left by an undelivered steer batch is replaced instead of holding the agent, and that busy-turn input written after the provider's reported turn end starts the next turn once instead of failing unconfirmed. Monitor output must publish exactly one monitor projection while preserving window membership and rollback. Task submissions keep limits, workspace ownership and replay at the shared manifest bound. Native-history recovery continues authorized workers once, preserves explicit Stop, and never replays uncertain input. An account transfer member moves at its next wake and keeps its queued input, a blocked member waits without a write per wake, and a move that sent no thread request can be cancelled.
# Clause 20: project preparation and retained worktree witnesses: Check project writes and bounded cleanup views.
# Clause 21: entity commit invalidation witnesses: Entity-only writes must wake entity-backed refs without advancing volatile resource versions; unknown and mixed writes retain broad invalidation.
# Clause 22: resource content invalidation witnesses: Unrelated commits must not trigger resource re-reads or duplicate server projections; unknown and racing reads retain safe refreshes.
# Clause 23: shared named schema validation witnesses: Preserve named-schema validation and error locations while HTTP reuses the compiled schema owner.
# Clause 24: branch turn metadata lookup witnesses: Avoid decoding turn bodies and reading past the predecessor while preserving branch cutoffs and unknown fork outcomes.
# Clause 25: task page HTTP projection witness: Keep task summaries and pagination unchanged while selecting records once per page.
# Clause 26: monitor ownership, history lock boundaries, and recovery witnesses: Check monitor starts across actor progress and turn boundaries, and bounded fair continuation retries, while preserving permission and ownership checks, and keep history metadata and completed repairs outside writer admission.
# Clause 27: Rust SQL boundary, lazy schema preparation and agent progress witnesses: Keep filesystem work outside SQLite and verify typed progress, idle assignments, and one parent result per completed turn.
# Clause 28: task authority and Claude input witnesses: Check that workers cannot act as the lead, gates hold, and Claude input keeps its origin and queue receipts.
# Clause 29: Desktop content identity and native attach witnesses: Healthy disk writes must not cause renderer reads; visible changes and native identity checks remain live.
# Clause 30: Primary state stream and conversation revision witnesses: Deliver state without extra pulls while retaining gap recovery and unchanged-chat suppression.
# Clause 31: Draft stream content witness: Unrelated commits must not request draft pulls; draft changes still notify.
# Clause 32: supervisor detach on shutdown witnesses: Check that shutdown waits for the supervisor to release both connections within one bound inside the shutdown budget, and that preparation and backend shutdown report an unconfirmed detach instead of losing it.
# Clause 33: supervisor detach on shutdown witnesses: Check that backend shutdown reports both detach timeouts through its real caller.
# Clause 34: worker worktree root witnesses: Check that worktrees under a configured root or the repository default stay owned, manageable after a root change, and that a substituted worker link is never cleaned.
# Vault readiness witness: OS metadata notifications replace renderer polls without reading keys.
# Limit failures refresh the account and stream rateLimit entities without a renderer GET.
# Actor timing uses a deterministic clock; registry durability observes completed SQLite checkpoints.
# Typed accounting mappings, strict ingress and native SDK schema parity.
